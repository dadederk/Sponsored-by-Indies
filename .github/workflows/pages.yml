name: Publish website

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - .gitignore
      - Website/**
      - Scripts/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - .gitignore
      - Website/**
      - Scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_SITE_URL: https://sponsored.byindies.com

jobs:
  build:
    # Artwork generation uses AppKit, so the Swift build needs macOS.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Check public repository boundaries
        run: swift Scripts/CheckPublicRepository.swift
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test website
        run: swift test --package-path Website --force-resolved-versions
      - name: Generate preview
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite
      - name: Generate public website
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --public --site-url "$PUBLIC_SITE_URL"
      - name: Check browser modules and generated pages
        run: node --test Website/Tests/*.test.mjs
      - name: Upload public website only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Website/BuildPublic

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
