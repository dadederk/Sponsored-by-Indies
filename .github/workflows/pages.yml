name: Publish website

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - .gitignore
      - Website/**
      - Scripts/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - .gitignore
      - Website/**
      - Scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    # Refresh date-dependent pages daily, including when no content has changed.
    - cron: '37 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_SITE_URL: https://sponsored.byindies.com

jobs:
  build:
    # Artwork generation uses AppKit, so the Swift build needs macOS.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Check public repository boundaries
        run: swift Scripts/CheckPublicRepository.swift
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Install browser checks
        working-directory: Website
        run: npm ci --ignore-scripts
      - name: Install test browsers
        working-directory: Website
        run: npx playwright install chromium webkit
      - name: Test website
        run: swift test --package-path Website --force-resolved-versions
      - name: Generate preview
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite
      - name: Generate public website
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --public --site-url "$PUBLIC_SITE_URL"
      - name: Generate By Indies preview and public website
        run: |
          swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --site showcase
          swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --site showcase --public --site-url https://byindies.com
      - name: Check browser modules and generated pages
        run: node --test Website/Tests/*.test.mjs
      - name: Check browser journeys and accessibility
        working-directory: Website
        run: npm run test:browser
      - name: Save failed browser check reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            Website/playwright-report/
            Website/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload public website only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Website/BuildPublic
      - name: Save By Indies publication
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: by-indies-public
          path: Website/BuildIndiesPublic
          include-hidden-files: true
          retention-days: 7

  publish-showcase:
    # A configured output-only repository serves the apex domain. All source stays here.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.BY_INDIES_PAGES_REPOSITORY != '' && vars.BY_INDIES_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication target
        env:
          TARGET_REPOSITORY: ${{ vars.BY_INDIES_PAGES_REPOSITORY }}
        run: |
          [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${TARGET_REPOSITORY,,}" != "${GITHUB_REPOSITORY,,}" ]]
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.BY_INDIES_PAGES_REPOSITORY }}
          token: ${{ secrets.BY_INDIES_PAGES_TOKEN }}
          ref: main
          path: pages
      - uses: actions/download-artifact@v4
        with:
          name: by-indies-public
          path: publication
      - name: Replace generated publication
        env:
          TARGET_REPOSITORY: ${{ vars.BY_INDIES_PAGES_REPOSITORY }}
        run: |
          test -f publication/index.html
          test "$(cat publication/CNAME)" = byindies.com
          if test -f pages/CNAME; then
            test "$(cat pages/CNAME)" = byindies.com
          fi
          if ! grep -Fxq '<!-- Generated by Sponsored-by-Indies. Edit the source repository. -->' pages/README.md; then
            if git -C pages ls-files | grep -Ev '^(README\.md|CNAME|\.nojekyll)$'; then
              echo 'The destination contains another project.' >&2
              exit 1
            fi
            starter_heading="# ${TARGET_REPOSITORY##*/}"
            starter_description='Independent projects and the people who make them. Generated from Sponsored by Indies.'
            readme="$(cat pages/README.md)"
            [[ "$readme" == "$starter_heading" || "$readme" == "$starter_heading"$'\n'"$starter_description" || "$readme" == "$starter_heading"$'\n\n'"$starter_description" ]]
          fi
          rsync -a --delete --exclude=.git publication/ pages/
          git -C pages config user.name github-actions[bot]
          git -C pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C pages add --all
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Publish By Indies from $GITHUB_SHA"
            git -C pages push origin HEAD:main
          fi

  price-review:
    # Live sources can be unavailable independently of date-only page rebuilds.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Check evidence dates with seven days of notice
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --check-maintenance
      - name: Compare current public price sources
        if: '!cancelled()'
        run: swift run --package-path Website --force-resolved-versions SponsoredByIndiesWebsite --verify-prices

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
